name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medikaone_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d medikaone_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -cover ./...
        env:
          TEST_DATABASE_DSN: postgresql://postgres:postgres@localhost:5432/medikaone_test?sslmode=disable
          TEST_DATABASE_RESET_CONFIRMATION: RESET-MEDIKAONE-TEST-DATABASE
          TEST_REDIS_DSN: redis://localhost:6379/15

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Scan reachable vulnerabilities
        run: govulncheck ./...
